<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Ceylon Gem Maison — pear-cut Ceylon sapphire">
  <defs>
    <linearGradient id="cgm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17396B"/>
      <stop offset="0.55" stop-color="#0C2450"/>
      <stop offset="1" stop-color="#071531"/>
    </linearGradient>
    <radialGradient id="cgm-glow" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#2C55A0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2C55A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cgm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3C57A"/>
      <stop offset="1" stop-color="#A67F2E"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#cgm-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#cgm-glow)"/>
  <rect x="30" y="30" width="452" height="452" rx="98" fill="none" stroke="url(#cgm-gold)" stroke-width="5" stroke-opacity="0.95"/>

  <!-- pear-cut brilliant, point up, drawn as line art -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- crown facets -->
    <g stroke="#86ACF8" stroke-width="5">
      <!-- table -->
      <polygon points="256,196 314,238 310,308 256,344 202,308 198,238"/>
      <!-- apex to table -->
      <path d="M256 84 L256 196"/>
      <!-- star facets at the point -->
      <path d="M331 186 L256 196 M181 186 L256 196"/>
      <!-- girdle-to-table mains -->
      <path d="M331 186 L314 238 M181 186 L198 238"/>
      <path d="M368 302 L314 238 M368 302 L310 308"/>
      <path d="M144 302 L198 238 M144 302 L202 308"/>
      <path d="M332 384 L310 308 M332 384 L256 344"/>
      <path d="M180 384 L202 308 M180 384 L256 344"/>
      <path d="M256 414 L256 344"/>
    </g>
    <!-- girdle outline, a touch brighter and heavier -->
    <path d="M256 84 C310 148 366 218 366 302 A110 110 0 1 1 146 302 C146 218 202 148 256 84 Z"
          stroke="#9BBCFF" stroke-width="8"/>
  </g>
</svg>
